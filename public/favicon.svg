<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Flower">
  <defs>
    <radialGradient id="c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4a8e8"/>
      <stop offset="100%" stop-color="#6b4a9a"/>
    </radialGradient>
  </defs>
  <!-- petals -->
  <g fill="#6b4a9a">
    <ellipse cx="16" cy="8.5" rx="4.2" ry="6.2"/>
    <ellipse cx="16" cy="8.5" rx="4.2" ry="6.2" transform="rotate(72 16 16)"/>
    <ellipse cx="16" cy="8.5" rx="4.2" ry="6.2" transform="rotate(144 16 16)"/>
    <ellipse cx="16" cy="8.5" rx="4.2" ry="6.2" transform="rotate(216 16 16)"/>
    <ellipse cx="16" cy="8.5" rx="4.2" ry="6.2" transform="rotate(288 16 16)"/>
  </g>
  <!-- lighter petal tips -->
  <g fill="#8b6bb8" opacity="0.55">
    <ellipse cx="16" cy="7.8" rx="2.4" ry="4"/>
    <ellipse cx="16" cy="7.8" rx="2.4" ry="4" transform="rotate(72 16 16)"/>
    <ellipse cx="16" cy="7.8" rx="2.4" ry="4" transform="rotate(144 16 16)"/>
    <ellipse cx="16" cy="7.8" rx="2.4" ry="4" transform="rotate(216 16 16)"/>
    <ellipse cx="16" cy="7.8" rx="2.4" ry="4" transform="rotate(288 16 16)"/>
  </g>
  <circle cx="16" cy="16" r="4.2" fill="url(#c)"/>
  <circle cx="16" cy="16" r="2" fill="#f3eafc"/>
</svg>
